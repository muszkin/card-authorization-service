spring:
  application:
    name: card-authorization-service
  mvc:
    problemdetails:
      enabled: true
  http:
    clients:
      imperative:
        factory: http-components
      connect-timeout: 100ms
      read-timeout: 150ms

authorization:
  max-acceptable-risk-score: 70
  hold-validity: 7d
  expiry-sweep-interval: PT1M

cache:
  cards:
    time-to-live: 10m

outbox:
  relay-interval: PT1S
  batch-size: 100

risk:
  scoring:
    base-url: http://localhost:8081

logging:
  structured:
    format:
      console: ecs
