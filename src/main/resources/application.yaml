spring:
  application:
    name: card-authorization-service
  http:
    clients:
      imperative:
        factory: http-components
      connect-timeout: 100ms
      read-timeout: 150ms

cache:
  cards:
    time-to-live: 10m

risk:
  scoring:
    base-url: http://localhost:8081

logging:
  structured:
    format:
      console: ecs
